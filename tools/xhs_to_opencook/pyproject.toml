[project]
name = "xhs-to-opencook"
version = "0.1.0"
description = "Export Xiaohongshu Diandian video recipes to openCook"
requires-python = ">=3.12"
dependencies = ["playwright>=1.58,<2", "pydantic>=2.10,<3", "pillow>=11,<13", "transitions==0.9.3", "py_trees==2.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
xhs-to-opencook = "xhs_to_opencook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_to_opencook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
